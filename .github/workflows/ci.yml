name: CI - MoodDiaryapp

on:
  push:
    branches: [main, develop, backend, frontend]
  pull_request:
    branches: [main, develop, backend, frontend]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Android build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Détecter le projet Android et les changements
        id: project
        run: python3 .github/scripts/android-ci.py
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}

      - name: Installer Java
        if: steps.project.outputs.run_android_build == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.project.outputs.java_version }}

      - name: Restaurer les dépendances Gradle
        if: steps.project.outputs.run_android_build == 'true'
        working-directory: ${{ steps.project.outputs.android_root }}
        run: ./gradlew --no-daemon --stacktrace dependencies

      - name: Exécuter les tests unitaires et compiler l'application
        if: steps.project.outputs.run_android_build == 'true'
        working-directory: ${{ steps.project.outputs.android_root }}
        run: ./gradlew --no-daemon --stacktrace test assembleDebug

      - name: Publier les rapports de tests Gradle
        if: always() && steps.project.outputs.run_android_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            ${{ steps.project.outputs.android_root }}/**/build/reports/tests/**
            ${{ steps.project.outputs.android_root }}/**/build/reports/problems/**
          if-no-files-found: warn
